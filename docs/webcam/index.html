<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7fb">
    <title>Clasificadores de imágenes</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 32px 16px;
        place-items: center;
      }

      main {
        width: min(100%, 760px);
      }

      h1 {
        margin: 0 0 10px;
        text-align: center;
        font-size: clamp(2rem, 6vw, 3rem);
      }

      .intro {
        margin: 0 0 28px;
        color: #596579;
        text-align: center;
      }

      .tests {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
        gap: 16px;
      }

      .test {
        display: flex;
        min-height: 220px;
        flex-direction: column;
        align-items: flex-start;
        padding: 24px;
        border: 1px solid #e1e7f0;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 12px 32px #26334d12;
      }

      .test h2 {
        margin: 0 0 10px;
      }

      .test p {
        flex: 1;
        margin: 0 0 22px;
        color: #596579;
      }

      .test a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 10px 16px;
        border-radius: 10px;
        color: #fff;
        background: #315ee8;
        font-weight: 650;
        text-decoration: none;
      }

      .test a:hover,
      .test a:focus-visible {
        background: #244bc4;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Clasificadores de imágenes</h1>
      <p class="intro">Elige el modelo que quieres probar.</p>

      <section class="tests" aria-label="Pruebas disponibles">
        <article class="test">
          <h2>Perros y gatos</h2>
          <p>Clasifica lo que ve la cámara como perro o gato.</p>
          <a href="perrosygatos/">Abrir clasificador</a>
        </article>

        <article class="test">
          <h2>Teachable Machine</h2>
          <p>Detecta las clases del modelo personalizado entrenado con Teachable Machine.</p>
          <a href="tm/">Abrir clasificador</a>
        </article>
      </section>
    </main>
  </body>
</html>
